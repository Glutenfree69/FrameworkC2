[package]
name = "reflective_dll_loader"
version = "0.1.0"
edition = "2021"
authors = ["Educational Purpose"]
description = "Educational shellcode loader using indirect syscalls + reflective dll injection"

[dependencies]
# Types NT (structures système)
ntapi = "0.4"

# Types C basiques
libc = "0.2"

# Winapi minimal pour types PE et NT (nécessaire pour resolve.rs et main.rs)
winapi = { version = "0.3.9", features = ["ntdef", "winnt", "minwindef", "ntstatus"] }

[profile.release]
opt-level = "z"      # Optimise pour la taille
lto = true           # Link Time Optimization
panic = "abort"      # Pas de stack unwinding
strip = true         # Strip symbols
codegen-units = 1    # + petit, + optimisé, patterns moins évidents

# Pour cross-compiler depuis macOS vers Windows:
# cargo build --release --target x86_64-pc-windows-gnu
