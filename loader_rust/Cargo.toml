[package]
name = "calc_loader"
version = "0.1.0"
edition = "2021"
authors = ["Educational Purpose"]
description = "Educational shellcode loader using direct syscalls - Pop calc.exe"

# Utilise Rust nightly pour certaines features
# rustup default nightly

[dependencies]
# Librairie pour les syscalls directs/indirects
# La feature "_DIRECT_" active les direct syscalls
# Alternative: "_INDIRECT_" pour indirect syscalls
rust_syscalls = { git = "https://github.com/janoglezcampos/rust_syscalls", features = ["_DIRECT_"] }

# Windows API bindings
winapi = { version = "0.3.9", features = [
    "memoryapi",
    "processthreadsapi",
    "errhandlingapi",
    "handleapi",
    "synchapi",
    "winbase",        # Pour INFINITE
    "ntstatus",       # Pour STATUS_SUCCESS
] }

[profile.release]
opt-level = "z"      # Optimise pour la taille
lto = true           # Link Time Optimization
panic = "abort"      # Pas de stack unwinding
strip = true         # Strip symbols

# Pour cross-compiler depuis macOS vers Windows:
# cargo build --release --target x86_64-pc-windows-gnu
